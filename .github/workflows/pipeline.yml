name: Estrutura de diretórios e arquivos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  EXEMPLO_VARIAVEL: "Valor de exemplo"
  NODE_VERSION: "18.x"
  
jobs:
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Execute Hello World
        run: echo "Hello, World!"

      - name: Mostrar Informações do Sistema
        run: |
          echo "Sistema Operacional: ${{ runner.os }}"
          echo "Diretorio Atual: ${pwd}"
          echo "Data e Hora: $(date)"
          echo "Usuario Atual: $(whoami)"
      
      - name: Listar arquivos do diretório
        run: ls -la

      - name: Comandos Multiplos
        run: |
          echo "Executando múltiplos comandos"
          echo "Diretório Atual: ${pwd}"
          echo "Listando arquivos:"
        

      